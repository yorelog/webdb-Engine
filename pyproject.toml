[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webdb-engine"
version = "0.1.0"
description = "Web-as-Database intelligent automation engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Browser automation
    "playwright>=1.44",
    # Database ORM
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # HTTP & parsing
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    # Data storage
    "pandas>=2.2",
    "pyarrow>=16.0",
    # Security / crypto
    "cryptography>=42.0",
    "python-dotenv>=1.0",
    # Async
    "anyio>=4.3",
    # Serialization
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    # Logging / audit
    "structlog>=24.1",
    # Optional: vector DB support
    "numpy>=1.26",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
webdb = "webdb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
